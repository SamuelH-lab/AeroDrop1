<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#087f45">
    <meta name="description" content="Acesse sua conta AeroDrop e acompanhe suas entregas.">

    <title>AeroDrop - Acesse sua conta</title>

    <link rel="stylesheet" href="lo.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <main class="container">

        <div class="logo-area">
            <a href="index.html" aria-label="Voltar para a página inicial">
                <h1>AeroDrop</h1>
            </a>

            <p>ENTREGA QUE CHEGA VOANDO</p>
        </div>

        <section class="login-card">

            <!-- Abas de navegação -->
            <div class="tabs">

                <button
                    type="button"
                    class="tab active"
                    id="login-tab"
                    aria-selected="true"
                >
                    <i class="fa-solid fa-user"></i>
                    Login
                </button>

                <button
                    type="button"
                    class="tab"
                    id="register-tab"
                    aria-selected="false"
                >
                    <i class="fa-solid fa-user-plus"></i>
                    Cadastre-se
                </button>

            </div>

            <!-- Formulário de Login -->
            <form class="login-form" id="login-form">

                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Email"
                        autocomplete="email"
                        aria-label="Email"
                        required
                    >
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-key"></i>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Senha"
                        autocomplete="current-password"
                        aria-label="Senha"
                        required
                    >
                </div>

                <div class="form-options">

                    <label class="remember">
                        <input type="checkbox" id="remember">
                        <span>Ficar conectado</span>
                    </label>

                    <a href="#" id="forgot-password">
                        Esqueceu sua senha?
                    </a>

                </div>

                <button type="submit" class="btn-enter">
                    Entrar
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <!-- Formulário de Cadastro -->
            <form class="login-form" id="register-form" hidden>

                <div class="input-group">
                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="register-name"
                        placeholder="Nome completo"
                        autocomplete="name"
                        aria-label="Nome completo"
                        required
                    >
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="register-email"
                        placeholder="Email"
                        autocomplete="email"
                        aria-label="Email"
                        required
                    >
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-key"></i>

                    <input
                        type="password"
                        id="register-password"
                        placeholder="Crie uma senha"
                        autocomplete="new-password"
                        aria-label="Crie uma senha"
                        minlength="6"
                        required
                    >
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirme sua senha"
                        autocomplete="new-password"
                        aria-label="Confirme sua senha"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" class="btn-enter">
                    Criar conta
                    <i class="fa-solid fa-user-plus"></i>
                </button>

            </form>

            <!-- Certificado digital -->
            <button type="button" class="certificate-btn" id="certificate-btn">
                <i class="fa-solid fa-certificate"></i>
                Entrar com certificado
            </button>

            <!-- Link inferior -->
            <div class="register" id="register-message">
                Ainda não criou sua conta?
                <a href="#" id="register-link">Cadastre-se agora.</a>
            </div>

        </section>

        <p class="back-home">
            <a href="index.html">
                <i class="fa-solid fa-arrow-left"></i>
                Voltar para o início
            </a>
        </p>

    </main>

    <script>
        // Elementos das abas
        const loginTab = document.getElementById("login-tab");
        const registerTab = document.getElementById("register-tab");

        const loginForm = document.getElementById("login-form");
        const registerForm = document.getElementById("register-form");

        const registerLink = document.getElementById("register-link");
        const registerMessage = document.getElementById("register-message");

        // Alternar entre Login e Cadastro
        function showLogin() {
            loginForm.hidden = false;
            registerForm.hidden = true;

            loginTab.classList.add("active");
            registerTab.classList.remove("active");

            loginTab.setAttribute("aria-selected", "true");
            registerTab.setAttribute("aria-selected", "false");

            registerMessage.innerHTML = `
                Ainda não criou sua conta?
                <a href="#" id="register-link">Cadastre-se agora.</a>
            `;

            document.getElementById("register-link").addEventListener("click", (event) => {
                event.preventDefault();
                showRegister();
            });
        }

        function showRegister() {
            loginForm.hidden = true;
            registerForm.hidden = false;

            registerTab.classList.add("active");
            loginTab.classList.remove("active");

            registerTab.setAttribute("aria-selected", "true");
            loginTab.setAttribute("aria-selected", "false");

            registerMessage.innerHTML = `
                Já possui uma conta?
                <a href="#" id="login-link">Faça login.</a>
            `;

            document.getElementById("login-link").addEventListener("click", (event) => {
                event.preventDefault();
                showLogin();
            });
        }

        loginTab.addEventListener("click", showLogin);
        registerTab.addEventListener("click", showRegister);

        registerLink.addEventListener("click", (event) => {
            event.preventDefault();
            showRegister();
        });

        // Login
        loginForm.addEventListener("submit", (event) => {
            event.preventDefault();

            alert("A interface de login está funcionando! Para autenticar usuários, será necessário conectar um sistema de backend.");
        });

        // Cadastro
        registerForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const password = document.getElementById("register-password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            if (password !== confirmPassword) {
                alert("As senhas não são iguais. Verifique e tente novamente.");
                return;
            }

            alert("Cadastro validado! Agora é necessário conectar um sistema de backend para salvar a conta.");

        });

        // Recuperação de senha
        document.getElementById("forgot-password").addEventListener("click", (event) => {
            event.preventDefault();
            alert("A recuperação de senha será disponibilizada quando o sistema de contas estiver conectado.");
        });

        // Certificado digital
        document.getElementById("certificate-btn").addEventListener("click", () => {
            alert("O acesso por certificado digital ainda precisa ser integrado.");
        });
    </script>

</body>
</html>
