<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroDrop - Login</title>

    <link rel="stylesheet" href="lo.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <main class="container">

        <div class="logo-area">
            <h1>AeroDrop</h1>
            <p>ENTREGA QUE CHEGA VOANDO</p>
        </div>

        <section class="login-card">

            <!-- Abas -->
            <div class="tabs">
                <button class="tab active">
                    <i class="fa-solid fa-user"></i>
                    Login
                </button>

                <button class="tab">
                    <i class="fa-solid fa-user"></i>
                    Cadastre-se
                </button>
            </div>

            <form class="login-form">

                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input
                        type="email"
                        placeholder="Email"
                        autocomplete="email"
                    >
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-key"></i>
                    <input
                        type="password"
                        placeholder="Senha"
                        autocomplete="current-password"
                    >
                </div>

                <div class="form-options">

                    <label class="remember">
                        <input type="checkbox">
                        <span>Ficar Conectado</span>
                    </label>

                    <a href="#">Esqueceu sua senha?</a>

                </div>

                <button type="submit" class="btn-enter" >
                    <a href="index.html">Entrar</a>
                </button>

            </form>
            <button class="certificate-btn">
                <i class="fa-regular fa-square"></i>
                Entrar com certificado
            </button>
            <div class="register">
                Ainda não criou sua conta?
                <a href="#">Cadastre-se agora.</a>
            </div>

        </section>

    </main>

</body>
</html>
